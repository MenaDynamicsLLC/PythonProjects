name: CLM Optimizer checks
on:
  push:
    paths: ['clm-windows-optimizer/**', '.github/workflows/clm-optimizer.yml']
  pull_request:
    paths: ['clm-windows-optimizer/**', '.github/workflows/clm-optimizer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 regression checks
        shell: powershell
        run: ./clm-windows-optimizer/tests/Test-Optimizer.ps1
      - name: PowerShell 7 regression checks
        shell: pwsh
        run: ./clm-windows-optimizer/tests/Test-Optimizer.ps1
      - name: Build ZIP
        shell: pwsh
        run: python ./clm-windows-optimizer/build_package.py
