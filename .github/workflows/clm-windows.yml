name: CLM Windows validation
on:
  push:
    paths: ['clm-windows-diagnostics/**', '.github/workflows/clm-windows.yml']
  pull_request:
    paths: ['clm-windows-diagnostics/**', '.github/workflows/clm-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate PowerShell engine
        shell: powershell
        run: ./clm-windows-diagnostics/Test-CLM.ps1

      - name: Validate Python sources
        shell: powershell
        run: |
          python -m py_compile ./clm-windows-diagnostics/CLM-Windows-App.py ./clm-windows-diagnostics/build_app.py ./clm-windows-diagnostics/build_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed' }

      - name: Install Windows build dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pyinstaller pillow
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed' }

      - name: Build Windows GUI executable
        shell: powershell
        run: |
          python ./clm-windows-diagnostics/build_app.py --output ./clm-windows-diagnostics/dist
          if ($LASTEXITCODE -ne 0) { throw 'GUI build failed' }

          $exe = "./clm-windows-diagnostics/dist/CLM-Windows-Toolkit.exe"
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Missing Windows executable' }

          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne 'CLM Windows Toolkit') { throw "Unexpected ProductName: $($info.ProductName)" }
          if ($info.CompanyName -ne 'Mena Dynamics, LLC') { throw "Unexpected CompanyName: $($info.CompanyName)" }
          if ($info.ProductVersion -notlike '2.0.0*') { throw "Unexpected ProductVersion: $($info.ProductVersion)" }

      - name: Build Windows ZIP
        shell: powershell
        run: |
          python ./clm-windows-diagnostics/build_package.py --output ./clm-windows-diagnostics/dist
          if ($LASTEXITCODE -ne 0) { throw 'ZIP builder failed' }

          foreach ($name in @(
            'CLM-Windows-Toolkit.exe',
            'CLM-Windows-Diagnostics.ps1',
            'CLM-Audit.ps1',
            'Launch-CLM.cmd',
            'Sign-CLM.ps1',
            'README.md',
            'CLM-Windows-Toolkit-Windows.zip'
          )) {
            if (-not (Test-Path "./clm-windows-diagnostics/dist/$name")) { throw "Missing $name" }
          }

      - name: Upload Windows application
        uses: actions/upload-artifact@v6
        with:
          name: CLM-Windows-Toolkit-Windows
          path: |
            clm-windows-diagnostics/dist/CLM-Windows-Toolkit-Windows.zip
            clm-windows-diagnostics/dist/CLM-Windows-Toolkit.exe
            clm-windows-diagnostics/dist/clm-toolkit.ico
          if-no-files-found: error
