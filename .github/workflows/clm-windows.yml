name: CLM Windows validation
on:
  push:
    paths: ['clm-windows-diagnostics/**', '.github/workflows/clm-windows.yml']
  pull_request:
    paths: ['clm-windows-diagnostics/**', '.github/workflows/clm-windows.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and cleanup safeguards in Windows PowerShell 5.1
        shell: powershell
        run: ./clm-windows-diagnostics/Test-CLM.ps1
      - name: Exercise Python packaging
        shell: powershell
        run: |
          python ./clm-windows-diagnostics/build_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Builder failed' }
          foreach ($name in @('CLM-Windows-Diagnostics.ps1', 'Launch-CLM.cmd', 'README.md')) {
            if (-not (Test-Path "./clm-windows-diagnostics/dist/$name")) { throw "Missing $name" }
          }
